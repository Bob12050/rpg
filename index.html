<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#18151f">
  <title>&#12477;&#12525;&#12539;&#12495;&#12463;&#12473;&#12521;RPG</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">M0 / M1 prototype</p>
        <h1 class="brand">&#12477;&#12525;&#12539;&#12495;&#12463;&#12473;&#12521;RPG</h1>
      </div>
      <span class="save-indicator" id="save-indicator">&#26410;&#20445;&#23384;</span>
    </header>

    <main class="layout">
      <section class="card" aria-label="player information">
        <div class="card-head">
          <div>
            <p class="label">&#20882;&#38522;&#32773;</p>
            <h2 class="name-row">
              <span id="p-name">-</span>
              <span class="job-badge" id="p-job">-</span>
            </h2>
          </div>
          <div class="level-box">
            <span>Lv</span>
            <strong id="p-level">-</strong>
          </div>
        </div>

        <div class="stat">
          <div class="stat-row"><span>HP</span><strong id="hp-text">-</strong></div>
          <div class="track"><div class="fill hp" id="hp-bar"></div></div>
        </div>

        <div class="stat">
          <div class="stat-row"><span>MP</span><strong id="mp-text">-</strong></div>
          <div class="track"><div class="fill mp" id="mp-bar"></div></div>
        </div>

        <div class="stat">
          <div class="stat-row"><span>EXP</span><strong id="exp-text">-</strong></div>
          <div class="track"><div class="fill exp" id="exp-bar"></div></div>
        </div>

        <div class="resource-row">
          <span>&#25152;&#25345;&#37329;</span>
          <strong><span id="p-gold">-</span> G</strong>
        </div>

        <div class="stat-grid" aria-label="combat stats">
          <div>
            <span>ATK</span>
            <strong id="p-atk">-</strong>
          </div>
          <div>
            <span>DEF</span>
            <strong id="p-def">-</strong>
          </div>
        </div>
      </section>

      <section class="card" aria-label="battle">
        <div class="card-head">
          <div>
            <p class="label">&#29694;&#22312;&#12398;&#25973;</p>
            <h2 class="name-row">
              <span id="enemy-name">-</span>
              <span class="enemy-level">Lv <span id="enemy-level">-</span></span>
            </h2>
          </div>
        </div>

        <div class="stat">
          <div class="stat-row"><span>ENEMY HP</span><strong id="enemy-hp-text">-</strong></div>
          <div class="track"><div class="fill enemy" id="enemy-hp-bar"></div></div>
        </div>

        <div class="battle-log" id="battle-log" aria-live="polite"></div>

        <div class="button-row">
          <button id="btn-attack" class="button primary">&#25915;&#25731;</button>
          <button id="btn-next-enemy" class="button">&#27425;&#12398;&#25973;</button>
        </div>
      </section>

      <section class="card inventory-card" aria-label="inventory">
        <div class="card-head">
          <div>
            <p class="label">&#25152;&#25345;&#21697;</p>
            <h2 class="name-row">&#12452;&#12531;&#12505;&#12531;&#12488;&#12522;</h2>
          </div>
        </div>

        <div class="equipped-list" id="equipped-list">
          <div class="equipped-row">
            <span>&#27494;&#22120;</span>
            <strong id="equipped-weapon">-</strong>
            <button id="btn-enhance-weapon" class="mini-button" data-action="enhance">&#24375;&#21270;</button>
            <button id="btn-unequip-weapon" class="mini-button">&#22806;&#12377;</button>
          </div>
          <div class="equipped-row">
            <span>&#38450;&#20855;</span>
            <strong id="equipped-armor">-</strong>
            <button id="btn-enhance-armor" class="mini-button" data-action="enhance">&#24375;&#21270;</button>
            <button id="btn-unequip-armor" class="mini-button">&#22806;&#12377;</button>
          </div>
        </div>

        <div class="inventory-list" id="inventory-list"></div>
      </section>

      <section class="tool-panel" aria-label="debug controls">
        <p class="panel-title">&#21205;&#20316;&#12486;&#12473;&#12488;</p>
        <div class="button-row">
          <button id="btn-damage" class="button">HP -10</button>
          <button id="btn-heal" class="button">HP +10</button>
          <button id="btn-exp" class="button">EXP +5</button>
        </div>
        <div class="button-row">
          <button id="btn-save" class="button subtle">&#12475;&#12540;&#12502;</button>
          <button id="btn-load" class="button subtle">&#12525;&#12540;&#12489;</button>
          <button id="btn-reset" class="button danger">&#12522;&#12475;&#12483;&#12488;</button>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
